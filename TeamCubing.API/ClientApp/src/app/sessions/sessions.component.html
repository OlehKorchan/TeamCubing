<mat-form-field appearance="fill" (selectionchange)="changeCurrentSession(currentSession.id)">
  <mat-label>Current session:</mat-label>
  <mat-select [(value)]="currentSession.id">
    <mat-option *ngFor="let session of sessions" [value]="session.id">
      {{ session.name }}
    </mat-option>
  </mat-select>
</mat-form-field>
<form (ngSubmit)="onNewSession()">
  <mat-form-field
    *ngIf="isSessionCreateMode; else addNewSession"
    appearance="fill"
    class="example-form-field"
  >
    <mat-label>New session</mat-label>
    <input [(ngModel)]="newSessionName" matInput name="newSessionName" required type="text" />
  </mat-form-field>
  <ng-template #addNewSession>
    <button (click)="toggleSessionCreateMode()" color="primary" mat-raised-button>
      New session
    </button>
  </ng-template>
</form>
<div>
  <button (click)="onClearSession()" color="warn" mat-button>Clear session</button>
</div>
<div>
  <button (click)="onRemoveSession(currentSession.id, currentSession.name)" color="warn" mat-button>
    Remove current session
  </button>
</div>
