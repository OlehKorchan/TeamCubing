name: Build and deploy ASP.Net Core app to Azure Web App - team-cubing

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build only src projects
        run: |
          dotnet build ./src/TeamCubing.API/TeamCubing.API.csproj -c Release
          dotnet build ./src/TeamCubing.BLL/TeamCubing.BLL.csproj -c Release
          dotnet build ./src/TeamCubing.DAL/TeamCubing.DAL.csproj -c Release
          dotnet build ./src/TeamCubing.Domain/TeamCubing.Domain.csproj -c Release
          dotnet build ./src/WcaScrambler/WcaScrambler.csproj -c Release

      - name: Run unit tests
        run: dotnet test ./test/TeamCubing.BLL.UnitTests/TeamCubing.BLL.UnitTests.csproj -c Release

      - name: dotnet publish API
        run: dotnet publish ./src/TeamCubing.API/TeamCubing.API.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read 

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.__clientidsecretname__ }}
          tenant-id: ${{ secrets.__tenantidsecretname__ }}
          subscription-id: ${{ secrets.__subscriptionidsecretname__ }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'team-cubing'
          slot-name: 'Production'
          package: .
