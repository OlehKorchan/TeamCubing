<div class="container text-center justify-content-center mx-0 px-0">
  <div class="row align-text-center">
    <div class="col-auto mb-3">
      <h2>{{ scramble }}</h2>
    </div>
  </div>
  <div class="row full-width">
    <div class="col-auto full-width">
      <mat-card
        (mousedown)="onTimerReady($event)"
        (mouseup)="onTimerFinished($event)"
        (touchend)="onTimerFinished($event)"
        (touchstart)="onTimerReady($event)"
        [class]="backgroundColorClass"
        class="timer-container mb-3"
      >
        <mat-card-content>
          <h1>
            {{ timeToString }}
          </h1>
          <div class="position-absolute bottom-0 end-0">
            <app-cube-image [scrambledCube]="puzzleImage"></app-cube-image>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
    <div *ngIf="isTimerStopped" class="row-cols-3 justify-content-center text-center">
      <button
        (click)="plusTwoSolve()"
        *ngIf="isNoPenalty()"
        class="col-sm-4 col-md-3 mt-3 mx-2"
        color="accent"
        mat-raised-button
      >
        +2
      </button>
      <button
        (click)="dnfSolve()"
        *ngIf="isNoPenalty()"
        class="col-sm-4 col-md-3 mt-3 mx-2"
        color="warn"
        mat-raised-button
      >
        DNF
      </button>
      <button
        (click)="disablePenalty()"
        *ngIf="isPlusTwo()"
        class="col-sm-4 col-md-3 mt-3 mx-2 text-center"
        color="accent"
        mat-raised-button
      >
        remove +2
      </button>
      <button
        (click)="disablePenalty()"
        *ngIf="isDnf()"
        class="col-sm-4 col-md-3 mt-3 mx-2 text-center"
        color="warn"
        mat-raised-button
      >
        remove DNF
      </button>
    </div>
  </div>
</div>
