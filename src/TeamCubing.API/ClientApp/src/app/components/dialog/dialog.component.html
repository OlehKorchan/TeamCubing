<h1 mat-dialog-title>{{ dialogData.title }}</h1>
<div mat-dialog-content>
  {{ dialogData.text }}
</div>
<div mat-dialog-actions>
  <button *ngIf="dialogData.onlyOkButton; else doubleButtons" [mat-dialog-close]="true" mat-button>
    OK
  </button>
  <ng-template #doubleButtons>
    <button [mat-dialog-close]="true" mat-button>YES</button>
    <button [mat-dialog-close]="false" mat-button>NO</button>
  </ng-template>
</div>
