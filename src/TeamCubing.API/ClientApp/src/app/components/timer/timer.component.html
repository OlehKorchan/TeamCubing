<div class="container text-center justify-content-center mx-0 px-0">
  <div class="row justify-content-between w-100">
    <div class="col-auto mb-3 m-0 p-0">
      <h2>{{ scramble }}</h2>
    </div>
    <div class="col-auto mb-3 m-0 p-0">
      <mat-button-toggle-group [(ngModel)]="currentTimingMode">
        <mat-button-toggle [value]="timingMode.Timer">
          <mat-icon>timer</mat-icon>
        </mat-button-toggle>
        <mat-button-toggle [value]="timingMode.Manual" (click)="focusManualInput()">
          <mat-icon>edit</mat-icon>
        </mat-button-toggle>
      </mat-button-toggle-group>
    </div>
  </div>
  <div class="row w-100">
    <div class="col-auto w-100 p-0 m-0">
      <mat-card
        *ngIf="isTimerMode(); else manual"
        (mousedown)="onTimerReady($event)"
        (mouseup)="onTimerFinished($event)"
        (touchend)="onTimerFinished($event)"
        (touchstart)="onTimerReady($event)"
        [class]="backgroundColorClass"
        class="timer-container mb-3"
      >
        <mat-card-content>
          <div class="mt-5">
            <h1 [style.font-size]="'2rem'">
              {{ timeToString }}
            </h1>
          </div>
          <div class="position-absolute bottom-0 end-0">
            <app-cube-image [scrambledCube]="puzzleImage"></app-cube-image>
          </div>
        </mat-card-content>
      </mat-card>
      <ng-template #manual>
        <mat-card class="timer-container mb-3">
          <mat-card-content>
            <input
              #manualInput
              [style.font-size]="'3rem'"
              class="form-control mt-5 mb-2"
              [(ngModel)]="inputTime"
              (input)="updateTime()"
              type="number"
              maxlength="8"
              max="24595999"
              min="1"
              (keyup.enter)="sendTime()"
            />
            <div>
              <h1 [style.font-size]="'2rem'">
                {{ timeToString }}
              </h1>
            </div>
            <div class="position-absolute bottom-0 end-0">
              <app-cube-image [scrambledCube]="puzzleImage"></app-cube-image>
            </div>
          </mat-card-content>
        </mat-card>
      </ng-template>
    </div>
    <div *ngIf="isTimerStopped" class="row-cols-3 justify-content-center text-center">
      <button
        (click)="sendTime()"
        class="col-sm-4 col-md-3 mt-3 mx-2"
        color="primary"
        mat-raised-button
      >
        Send result
      </button>
      <button
        (click)="plusTwoSolve()"
        *ngIf="isNoPenalty()"
        class="col-sm-4 col-md-3 mt-3 mx-2"
        color="accent"
        mat-raised-button
      >
        +2
      </button>
      <button
        (click)="dnfSolve()"
        *ngIf="isNoPenalty()"
        class="col-sm-4 col-md-3 mt-3 mx-2"
        color="warn"
        mat-raised-button
      >
        DNF
      </button>
      <button
        (click)="disablePenalty()"
        *ngIf="isPlusTwo()"
        class="col-sm-4 col-md-3 mt-3 mx-2 text-center"
        color="accent"
        mat-raised-button
      >
        remove +2
      </button>
      <button
        (click)="disablePenalty()"
        *ngIf="isDnf()"
        class="col-sm-4 col-md-3 mt-3 mx-2 text-center"
        color="warn"
        mat-raised-button
      >
        remove DNF
      </button>
    </div>
  </div>
</div>
